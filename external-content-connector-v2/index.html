<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外部内容平台集成 V2 · 原型 · EngageLab MA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #5d6df0; }
    .prototype-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .back-home {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 99999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.9);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      padding: 6px 12px 6px 8px;
      border-radius: 8px;
      background: rgba(0,0,0,0.32);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .back-home:hover {
      color: #fff;
      background: rgba(0,0,0,0.5);
      border-color: rgba(255,255,255,0.4);
      transform: translateX(-1px);
    }
    .back-home svg { width: 14px; height: 14px; opacity: 0.9; }
    @media print { .back-home { display: none; } }
  </style>
</head>
<body>
  <a class="back-home" href="../" title="返回首页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    返回首页
  </a>
  <iframe class="prototype-frame" src="./prototype.html" title="外部内容平台集成 V2 原型" allow="clipboard-write; clipboard-read"></iframe>
</body>
</html>
